  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link

    href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
  >
  <script src="theme-init.js"></script>
  <style>
    .app-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #f7f3e8;
      color: #181818;
      font-family: "Newsreader", ui-serif, Georgia, serif;
      font-style: italic;
      font-size: 18px;
      z-index: 9999;
    }
    [data-theme="dark"] .app-loader {
      background: #1b1812;
      color: #ece6d6;
    }
    .app-loader-ring {
      width: 28px;
      height: 28px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 999px;
      animation: app-loader-spin 0.9s linear infinite;
      opacity: 0.75;
    }
    @keyframes app-loader-spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .app-loader-ring { animation: none; }
    }
  </style>
</head>
<body>
  <app-root>
    <div class="app-loader" role="status" aria-live="polite">
      <div class="app-loader-ring" aria-hidden="true"></div>
      <div>Loading Makina…</div>
    </div>
  </app-root>
</body>
